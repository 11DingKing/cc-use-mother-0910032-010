[project]
name = "authorization-package-0910032-010"
version = "1.0.0"
description = "项目授权依赖包：版本化授权条件、证据冻结、完整性规则、决定链与依赖失效传播"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
